name: Finance checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check app.js && node --check core.js
      - run: node test_core.js
      - run: node test_views.js
      - run: node test_save.js
      - run: python -m pip install -r requirements-pdf.txt
      - run: python -m unittest test_server.py test_state_validation.py test_concurrency.py -v
